name: Release

on:
  push:
    tags: ['v*']
  # Lets a build be verified without publishing anything: the release job below
  # only runs for tags.
  workflow_dispatch:

jobs:
  build:
    strategy:
      # A failure on one platform should not hide the state of the others.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Runs make:icon, typecheck, electron-vite build and electron-builder for
      # the targets declared in electron-builder.yml.
      - run: npm run dist:${{ matrix.platform }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          # Only the distributables: the release directory also holds unpacked
          # app trees and builder metadata.
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # The changelog section for this version becomes the release body.
      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { flag = 1; next }
            /^## \[/ { flag = 0 }
            flag
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No changelog section for $version" >&2
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Supermicro IPMI Client ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            artifacts/*
